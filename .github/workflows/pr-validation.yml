name: PR Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - ".github/workflows/pr-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: |
            apps/client/package-lock.json
            apps/server/package-lock.json

      # Server validation
      - name: Install server dependencies
        working-directory: apps/server
        run: npm ci

      - name: Lint server
        working-directory: apps/server
        run: npm run lint
        continue-on-error: true

      - name: Run server tests
        working-directory: apps/server
        run: npm test
        continue-on-error: true

      - name: Build server
        working-directory: apps/server
        run: npm run build

      # Client validation
      - name: Install client dependencies
        working-directory: apps/client
        run: npm ci

      - name: Lint client
        working-directory: apps/client
        run: npm run lint
        continue-on-error: true

      - name: Run client tests
        working-directory: apps/client
        run: npm test
        continue-on-error: true

      - name: Build client
        working-directory: apps/client
        run: npm run build

  # Security audit job
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: |
            apps/client/package-lock.json
            apps/server/package-lock.json

      - name: Audit server dependencies
        working-directory: apps/server
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Audit client dependencies
        working-directory: apps/client
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # Summary job
  pr-validation-summary:
    runs-on: ubuntu-latest
    needs: [validate, security]
    if: always()

    steps:
      - name: Check validation results
        run: |
          if [[ "${{ needs.validate.result }}" == "failure" || "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ PR validation failed"
            exit 1
          fi
          echo "✅ PR validation passed"
        run: |
          if [[ "${{ needs.commit-message.result }}" == "failure" || "${{ needs.validate.result }}" == "failure" || "${{ needs.security.result }}" == "failure" ]]; then
            echo "❌ PR validation failed"
            exit 1
          fi
          echo "✅ PR validation passed"
